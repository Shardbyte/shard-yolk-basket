name: Publish Images

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated target platforms.
        required: true
        default: linux/amd64,linux/arm64
      push:
        description: Push images to GHCR.
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 30
  IMAGE_REVISION: ${{ github.sha }}
  IMAGE_CREATED: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
  PUBLISH_IMAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}

jobs:
  detect-build-targets:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve comparison range
        id: range
        shell: bash
        run: |
          # Tag releases always rebuild everything — pass empty BASE_SHA so
          # changed-targets.sh falls through to add_all.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "base=" >> "${GITHUB_OUTPUT}"
          else
            echo "base=${{ github.event.before }}" >> "${GITHUB_OUTPUT}"
          fi
          echo "head=${{ github.sha }}" >> "${GITHUB_OUTPUT}"

      - name: Detect changed image targets
        id: targets
        run: ./scripts/changed-targets.sh "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" "${{ github.event_name }}"

  publish:
    name: Build And Publish (${{ matrix.target }})
    needs: detect-build-targets
    if: ${{ needs.detect-build-targets.outputs.count > 0 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-build-targets.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "registry=ghcr.io/${owner}"
            echo "source=https://github.com/${GITHUB_REPOSITORY}"
            echo "platforms=${{ inputs.platforms || 'linux/amd64,linux/arm64' }}"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish images
        uses: docker/bake-action@v7
        with:
          source: .
          files: build/docker-bake.hcl
          targets: ${{ matrix.target }}
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          sbom: true
          provenance: mode=max
          set: |
            *.cache-from=type=gha,scope=publish-${{ matrix.target }}
            *.cache-to=type=gha,scope=publish-${{ matrix.target }},mode=max
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
          IMAGE_SOURCE: ${{ steps.image.outputs.source }}
          IMAGE_REVISION: ${{ env.IMAGE_REVISION }}
          IMAGE_CREATED: ${{ env.IMAGE_CREATED }}
          PLATFORMS: ${{ steps.image.outputs.platforms }}
