name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
  IMAGE_SOURCE: https://github.com/${{ github.repository }}
  IMAGE_REVISION: ${{ github.sha }}
  IMAGE_CREATED: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

jobs:
  policy:
    name: Policy And Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Repository policy checks
        run: ./scripts/validate.sh

      - name: Catalog validation
        run: |
          pip install --quiet pyyaml
          python3 scripts/validate-catalog.py

      - name: Whitespace checks
        run: git diff --check

      - name: Executable script checks
        run: |
          test -x scripts/validate.sh
          test -x scripts/changed-targets.sh
          test -x scripts/validate-catalog.py
          test -x oses/debian/entrypoint.sh
          find . -type f -name 'entrypoint.sh' -not -exec test -x {} \; -print | grep . && exit 1 || true

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: Shardbyte/shard-shellcheck@v1

  workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  dockerfiles:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml

  bake-check:
    name: Build Definition Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Render bake definition
        run: docker buildx bake -f build/docker-bake.hcl --print

      - name: Validate bake targets
        run: docker buildx bake -f build/docker-bake.hcl --list=targets
        env:
          PLATFORMS: linux/amd64

  detect-build-targets:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve comparison range
        id: range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "${GITHUB_OUTPUT}"
          else
            echo "base=${{ github.event.before }}" >> "${GITHUB_OUTPUT}"
          fi
          echo "head=${{ github.sha }}" >> "${GITHUB_OUTPUT}"

      - name: Detect changed image targets
        id: targets
        run: ./scripts/changed-targets.sh "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" "${{ github.event_name }}"

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs:
      - detect-build-targets
      - policy
      - shellcheck
      - workflows
      - dockerfiles
      - bake-check
    if: ${{ needs.detect-build-targets.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-build-targets.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v7
        with:
          source: .
          files: build/docker-bake.hcl
          targets: ${{ matrix.target }}
          push: false
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,scope=${{ matrix.target }},mode=max
        env:
          PLATFORMS: linux/amd64
